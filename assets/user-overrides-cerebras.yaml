modelSelector:
  # MUST match what's specified in `customModels`.
  vendor: customoai
  id: zai-glm-4.7

installExtensions:
  - id: github.copilot-chat
    mode: vsix
    path: /agent/assets/extensions/copilot-chat-0.37.0.vsix

customModels:
  customoai:
    zai-glm-4.7:
      name: 'glm-4.7'
      url: 'https://api.cerebras.ai/v1/chat/completions'
      toolCalling: true
      vision: false
      thinking: true
      requiresAPIKey: true
      maxInputTokens: 128000
      maxOutputTokens: 16384
      requestHeaders:
        service_tier: 'flex'
        temperature: 0.6
